<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticket Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Support operations</p>
        <h1>Ticket Desk</h1>
      </div>
      <div class="topbar-actions">
        <a class="ghost" href="/docs" target="_blank" rel="noreferrer">API docs</a>
        <button id="new-ticket" type="button">New ticket</button>
      </div>
    </header>

    <main class="layout">
      <div class="left-col">
        <section class="panel tickets-panel">
          <div class="panel-head">
            <h2>Open queue</h2>
            <span id="ticket-count" class="count">0</span>
          </div>
          <div id="ticket-list" class="ticket-list"></div>
        </section>

        <section class="panel form-panel">
          <div class="panel-head">
            <h2 id="form-title">Create ticket</h2>
            <button id="cancel-edit" class="text-btn hidden" type="button">Cancel</button>
          </div>
          <form id="ticket-form">
            <div class="grid">
              <label>
                Ticket ID
                <input id="ticket_id" name="ticket_id" placeholder="Auto if blank" />
              </label>
              <label>
                Status
                <select id="status" name="status">
                  <option>Open</option>
                  <option>In Progress</option>
                  <option>Escalated</option>
                  <option>Resolved</option>
                  <option>Closed</option>
                  <option>Refunded / Resolved</option>
                </select>
              </label>
              <label>
                Customer name
                <input id="customer_name" name="customer_name" required />
              </label>
              <label>
                Customer email
                <input id="customer_email" name="customer_email" type="email" />
              </label>
              <label class="full">
                Issue
                <textarea id="issue" name="issue" rows="3" required></textarea>
              </label>
              <label>
                Purchase amount
                <input id="purchase_amount" name="purchase_amount" type="number" min="0" step="0.01" value="0" />
              </label>
              <label>
                Max refund
                <input id="max_refund" name="max_refund" type="number" min="0" step="0.01" placeholder="Same as purchase" />
              </label>
              <label class="check full">
                <input id="eligible_for_refund" name="eligible_for_refund" type="checkbox" checked />
                Eligible for refund
              </label>
            </div>
            <button id="save-ticket" type="submit">Save ticket</button>
          </form>
        </section>
      </div>

      <section class="panel chat-panel">
        <div class="panel-head">
          <div>
            <h2>Agent chat</h2>
            <p class="hint chat-hint">Ask follow-ups about any ticket. Context stays in this conversation.</p>
          </div>
          <button id="new-chat" class="text-btn" type="button">New chat</button>
        </div>
        <div id="chat-log" class="chat-log" aria-live="polite"></div>
        <form id="agent-form" class="chat-composer">
          <textarea id="agent-message" rows="2" placeholder="Ask about a ticket, then follow up..."></textarea>
          <button type="submit">Send</button>
        </form>
      </section>
    </main>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
